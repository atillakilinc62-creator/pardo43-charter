<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DERGO'S TO DO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>DERGO'S TO DO</h1>
      <p class="app__date" id="date"></p>
    </header>

    <!-- ===== GİRİŞ / KAYIT ===== -->
    <section id="auth-view" class="auth">
      <form class="auth__form" id="auth-form">
        <input
          type="email"
          id="auth-email"
          class="auth__input"
          placeholder="E-posta"
          autocomplete="email"
          required
        />
        <input
          type="password"
          id="auth-password"
          class="auth__input"
          placeholder="Şifre (en az 6 karakter)"
          autocomplete="current-password"
          minlength="6"
          required
        />
        <button type="submit" class="auth__btn" id="auth-submit">Giriş yap</button>
      </form>
      <p class="auth__switch">
        <span id="auth-switch-text">Hesabın yok mu?</span>
        <a href="#" id="auth-toggle">Kaydol</a>
      </p>
      <p class="auth__msg" id="auth-msg"></p>
    </section>

    <!-- ===== UYGULAMA (giriş sonrası) ===== -->
    <section id="app-view" hidden>
      <div class="userbar">
        <span class="userbar__email" id="user-email"></span>
        <button class="userbar__logout" id="logout">Çıkış</button>
      </div>

      <form class="todo-form" id="todo-form">
        <input
          type="text"
          id="todo-input"
          class="todo-form__input"
          placeholder="Yeni bir görev ekle..."
          autocomplete="off"
          maxlength="120"
        />
        <input
          type="date"
          id="todo-date"
          class="todo-form__date"
          title="Son tarih (isteğe bağlı)"
        />
        <button type="submit" class="todo-form__btn" aria-label="Ekle">+</button>
      </form>

      <div class="filters" id="filters">
        <button class="filters__btn is-active" data-filter="all">Tümü</button>
        <button class="filters__btn" data-filter="active">Aktif</button>
        <button class="filters__btn" data-filter="done">Tamamlanan</button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>

      <footer class="app__footer" id="footer">
        <span id="count">0 görev</span>
        <button class="app__clear" id="clear-done">Tamamlananları sil</button>
      </footer>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
